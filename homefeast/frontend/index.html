<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeFeast</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar (hidden on login/register) -->
  <nav id="main-nav" class="navbar navbar-expand-lg navbar-dark pp-nav d-none">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#/dashboard"><i class="bi bi-egg-fried me-2"></i>HomeFeast</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks"
              aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navLinks">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#/dashboard">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#/explore">Explore</a></li>
          <li class="nav-item"><a class="nav-link" href="#/pantry">What can I cook?</a></li>
          <li class="nav-item"><a class="nav-link" href="#/recipes">My recipes</a></li>
          <li class="nav-item"><a class="nav-link" href="#/favorites">Favorites</a></li>
          <li class="nav-item"><a class="nav-link" href="#/admin">Admin</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-sm btn-outline-light" href="#/profile"><i class="bi bi-person-circle me-1"></i>Profile</a>
          <a class="btn btn-sm btn-light" href="#/login">Log out</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- SPA content is injected here -->
  <main id="app" class="container py-4"></main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

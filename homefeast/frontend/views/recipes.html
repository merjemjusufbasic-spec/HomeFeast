<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h2 class="mb-0">My recipes</h2>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#recipeFormModal"><i class="bi bi-plus-lg me-1"></i>Add recipe</button>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Title</th><th>Category</th><th>Time</th><th>Servings</th><th>Rating</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        <tr><td>Grandma's Sarma</td><td>Main course</td><td>90 min</td><td>6</td><td class="star">&#9733;&#9733;&#9733;&#9733;&#9733;</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#recipeFormModal">Edit</button> <button class="btn btn-sm btn-outline-danger">Delete</button></td></tr>
        <tr><td>Quick Tomato Pasta</td><td>Pasta</td><td>20 min</td><td>2</td><td class="star">&#9733;&#9733;&#9733;&#9733;&#9734;</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#recipeFormModal">Edit</button> <button class="btn btn-sm btn-outline-danger">Delete</button></td></tr>
        <tr><td>Apple Pie</td><td>Dessert</td><td>75 min</td><td>8</td><td class="star">&#9733;&#9733;&#9733;&#9733;&#9734;</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#recipeFormModal">Edit</button> <button class="btn btn-sm btn-outline-danger">Delete</button></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="recipeFormModal" tabindex="-1" aria-labelledby="recipeFormLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" onsubmit="return false">
      <div class="modal-header">
        <h5 class="modal-title" id="recipeFormLabel">Recipe details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Title</label><input type="text" class="form-control" required></div>
        <div class="row">
          <div class="col-md-4 mb-3"><label class="form-label">Category</label><select class="form-select"><option>Breakfast</option><option>Pasta</option><option>Dessert</option></select></div>
          <div class="col-6 col-md-4 mb-3"><label class="form-label">Prep time (min)</label><input type="number" class="form-control" min="1"></div>
          <div class="col-6 col-md-4 mb-3"><label class="form-label">Servings</label><input type="number" class="form-control" min="1"></div>
        </div>
        <div class="mb-3">
          <label class="form-label">Ingredients</label>
          <div class="row g-2 mb-2"><div class="col-7"><select class="form-select"><option>tomato</option><option>pasta</option></select></div><div class="col-3"><input type="number" class="form-control" placeholder="Qty"></div><div class="col-2"><button type="button" class="btn btn-outline-danger w-100" aria-label="Remove ingredient"><i class="bi bi-trash"></i></button></div></div>
          <button type="button" class="btn btn-sm btn-outline-primary"><i class="bi bi-plus-lg me-1"></i>Add ingredient</button>
        </div>
        <div class="mb-0"><label class="form-label">Instructions</label><textarea class="form-control" rows="5" required></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

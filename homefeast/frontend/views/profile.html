<h2 class="mb-3">My profile</h2>
<div class="row g-4">
  <div class="col-lg-6">
    <div class="card"><div class="card-body">
      <h5 class="mb-3">Account details</h5>
      <form onsubmit="return false">
        <div class="mb-3"><label class="form-label">Full name</label><input type="text" class="form-control" value="name"></div>
        <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" value="name@example.com"></div>
        <div class="mb-3"><label class="form-label">Role</label><input type="text" class="form-control" value="member" disabled></div>
        <button class="btn btn-primary">Save changes</button>
      </form>
    </div></div>
  </div>
  <div class="col-lg-6">
    <div class="card"><div class="card-body">
      <h5 class="mb-3">Change password</h5>
      <form onsubmit="return false">
        <div class="mb-3"><label class="form-label">Current password</label><input type="password" class="form-control"></div>
        <div class="mb-3"><label class="form-label">New password</label><input type="password" class="form-control" minlength="8"></div>
        <button class="btn btn-outline-primary">Update password</button>
      </form>
    </div></div>
  </div>
</div>

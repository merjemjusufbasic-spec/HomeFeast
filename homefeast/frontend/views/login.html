<div class="auth-wrap">
  <div class="text-center mb-4">
    <div class="brand"><i class="bi bi-egg-fried me-2"></i>HomeFeast</div>
    <p class="text-muted">Cook what you have. Discover what you love.</p>
  </div>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-3">Log in</h4>
      <form data-goto="#/dashboard">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="text-center small mt-3 mb-0">No account yet? <a href="#/register">Register</a></p>
    </div>
  </div>
</div>
